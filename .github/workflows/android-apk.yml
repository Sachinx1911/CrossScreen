name: Android APK

# apps/android is outside the pnpm workspace, so it is not touched by ci.yml.
# This does two jobs in one: on every push/PR it proves the Kotlin actually
# compiles (the coding agent's own shell cannot run a Gradle build task), and
# on a v* tag it attaches the built debug APK to a GitHub Release so the
# landing page has something real to link to.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/android/**'
      - 'packages/protocol/schema/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # only used by the release step, and only on a tag

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 / build-tools 36.0.0 (app/build.gradle.kts). AGP would
      # download these itself, but doing it explicitly makes a failure here
      # read as "SDK component missing", not a mystery mid-build.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk crossscreen.apk

      - name: Upload as a build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: crossscreen-debug-apk
          path: apps/android/crossscreen.apk
          if-no-files-found: error

      - name: Attach to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/crossscreen.apk
          fail_on_unmatched_files: true
          body: |
            Debug (unsigned) APK, for testing — not a Play Store build.

            To install: download `crossscreen.apk` on the phone, then allow
            "Install unknown apps" for whatever opened it. Screen sharing and
            joining need a CrossScreen server set in Settings → Server.
