name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. action-setup v4 refuses to run when a
      # version is given here *and* in package.json's `packageManager` field,
      # to avoid the two drifting apart. packageManager is the single source.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        # Nothing in CI launches Electron, and the runtime is a ~100 MB
        # download per run. Its TypeScript definitions ship in the npm package
        # either way, so typecheck and lint are unaffected.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # Everything after this needs the workspace packages' generated types.
      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The unit tests all passed while the product was broken three separate
      # ways — a black video on a healthy connection, a cancelled start that
      # joined anyway, and a stale approval prompt. Only running the whole
      # thing across two browser contexts found any of them.
      - name: Install Playwright browser
        run: pnpm --filter @crossscreen/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload end-to-end report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      # The generated JSON Schema is the contract the Kotlin and Swift clients
      # are built from. If it is stale in the repo, those clients are being
      # generated from something that no longer matches the TypeScript.
      - name: Verify generated schema is current
        run: |
          pnpm schema
          if ! git diff --exit-code -- packages/protocol/schema; then
            echo "::error::packages/protocol/schema is out of date. Run 'pnpm schema' and commit the result."
            exit 1
          fi
