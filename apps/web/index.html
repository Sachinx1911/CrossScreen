<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrossScreen — Viewer (skeleton)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --fg: #e8eaed;
        --muted: #9aa3ad;
        --accent: #2f6fed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid #1c2126;
        flex: 0 0 auto;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.live {
        background: #2fbf71;
      }
      .dot.bad {
        background: #e5534b;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      #status {
        color: var(--muted);
      }
      main {
        flex: 1 1 auto;
        display: grid;
        place-items: center;
        background: #000;
        min-height: 0;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      footer {
        flex: 0 0 auto;
        padding: 8px 16px;
        border-top: 1px solid #1c2126;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .hint {
        color: var(--muted);
        text-align: center;
        padding: 24px;
        max-width: 46ch;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>CrossScreen</h1>
      <span id="status">Starting…</span>
    </header>
    <main>
      <video id="remote" autoplay playsinline muted></video>
      <p class="hint" id="hint">Waiting for a screen to be shared…</p>
    </main>
    <footer id="stats">no connection yet</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
