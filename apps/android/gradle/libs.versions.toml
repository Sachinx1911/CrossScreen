[versions]
agp = "9.4.0"
kotlin = "2.4.20"
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.0"
activityCompose = "1.10.0"
composeBom = "2026.02.00"
# Decodes packages/protocol/schema/*.json's payload once it reaches this app,
# via the generated Protocol.kt (packages/protocol/src/generate-kotlin.ts).
kotlinxSerializationJson = "1.9.0"
# Google stopped publishing org.webrtc to Maven in 2019 (ADR-0003 says
# "Google's org.webrtc" — this is that same package, kept current by the
# webrtc-sdk community build, the one LiveKit and flutter-webrtc also use).
# 144.7559.15 not the newer 150.7871.01 on purpose: 150 is days old with a
# single patch, 144 is the settled end of its milestone line — the same
# caution the AGP/Gradle pin (b092259) was a lesson in. Bump once 150 has
# a few patch releases behind it.
webrtc = "144.7559.15"
# The one dependency the signaling/API client slice adds: OkHttp gives a
# WebSocket and an HTTP client in one small library (~1 MB, minSdk 21).
# 4.12.0, the long-settled LTS line, not 5.x — same "don't lead with the
# newest" caution as the webrtc and AGP pins; the WebSocket + Call APIs
# used here are identical across the two.
okhttp = "4.12.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
webrtc = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
