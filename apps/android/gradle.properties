# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX only — the legacy support library has no place starting a
# project in 2026.
android.useAndroidX=true
# Kotlin, not Java, generates this project's R/BuildConfig classes non-transitively —
# faster incremental builds, and the default AGP itself recommends.
android.nonTransitiveRClass=true
