<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The renderer is loaded from a file:// URL, where CSP 'self' does NOT
      match the page's own assets — a bare script-src 'self' blocks the bundle
      entirely and the page silently does nothing. Hence the explicit `file:`.

      Phase 1 should serve the renderer over a custom app:// protocol instead,
      which makes 'self' meaningful and lets this be tightened properly.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: blob:; connect-src ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>CrossScreen — Sharer (skeleton)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --fg: #e8eaed;
        --muted: #9aa3ad;
        --accent: #2f6fed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.6 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.live {
        background: #2fbf71;
      }
      .dot.bad {
        background: #e5534b;
      }
      video {
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        background: #000;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      pre {
        background: #12161b;
        border: 1px solid #1c2126;
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--muted);
        font-size: 12px;
        margin: 0;
        white-space: pre-wrap;
        min-height: 3em;
      }
    </style>
  </head>
  <body>
    <h1>CrossScreen — walking skeleton</h1>
    <p class="sub">Phase 0.5. Proves capture to WebRTC to a remote browser. No UI beyond this.</p>

    <div class="row">
      <span class="dot" id="dot"></span>
      <span id="status">Idle</span>
    </div>

    <div class="row">
      <button id="share">Start Sharing</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <video id="preview" autoplay playsinline muted></video>
    <pre id="stats">no connection yet</pre>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
