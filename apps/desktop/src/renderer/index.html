<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The renderer is served over the custom app:// scheme (see
      src/main/renderer-protocol.ts), which gives it a real origin, so 'self'
      means something and this policy can stay tight. On a file:// page 'self'
      matches nothing and a policy like this blocks the app's own bundle.

      connect-src stays open to ws/wss and http/https because the signaling and
      API URLs are configuration, not fixed hosts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src ws: wss: http: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>CrossScreen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
