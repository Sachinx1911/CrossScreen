packages:
  - 'apps/web'
  - 'apps/desktop'
  - 'services/*'
  - 'packages/*'
  - 'tests/*'

# Dependency install scripts are blocked by default; each one is an arbitrary
# command from a third party, so allowing them is a deliberate act.
# esbuild is a Vite dependency and needs its script to place the platform binary.
allowBuilds:
  # A Vite dependency; its script places the platform binary.
  esbuild: true
  # Downloads the Chromium runtime the desktop app is built on (ADR-0002).
  electron: true
